version: "3.3"

services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"  # web UI
      - "1025:1025"  # smtp
    networks:
      - openireland-network

  backend:
    container_name: openireland-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - BACKEND_PORT=20001
      - FRONTEND_URL=http://localhost:25002
      - DEBUG=True
      - DATABASE_URL=mysql+pymysql://local_user:password@host.docker.internal:13306/provdb_test
      - SMTP_HOST=mailhog  # TestBed.Scheduler.com # example: smtp.example.com
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false # switch to false laters
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - SMTP_FROM_EMAIL=no-reply@scheduler.com
      - APP_PUBLIC_URL=http://localhost:25002
      - PASSWORD_RESET_TTL_MINUTES=45
      - PASSWORD_RESET_RATE_LIMIT_PER_HOUR=5
      - EMAIL_VERIFY_TTL_MINUTES=60
    volumes:
      - ./backend:/app/backend
    ports:
      - "25001:20001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - openireland-network

  scheduler-frontend:
    container_name: openireland-scheduler-frontend
    build:
      context: scheduler/frontend
      dockerfile: Dockerfile
    ports:
      - "25002:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:25001
      - PORT=3000
    volumes:
      - ./scheduler/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - openireland-network

  inventory-frontend:
    container_name: openireland-inventory-frontend
    build:
      context: inventory/frontend
      dockerfile: Dockerfile
    ports:
      - "25003:3001"
    environment:
      - REACT_APP_API_URL=http://localhost:25001
      - REACT_APP_SCHEDULER_API_URL=http://localhost:25001
      - PORT=3001
    volumes:
      - ./inventory/frontend:/app
      - ./packages/ui:/app/packages/ui
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - openireland-network

networks:
  openireland-network:
    driver: bridge
